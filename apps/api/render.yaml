# Render 배포 설정.
#
# **같은 Dockerfile 을 쓴다.** 배포처가 바뀌어도 빌드 내용은 안 바뀐다.
#
# **영구 디스크를 안 쓴다.** 커밋된 `parts/*.json` 을 기동 때 DB 로 다시 만들기
# 때문이다 (`service.seed_facts`). 그래서 무료 플랜으로 돌 수 있다.
# 사용자가 올린 검사 기록은 재배포 때 사라지는데, 데모에는 문제가 없다 —
# 샘플 검사도 기동 때 다시 심는다 (F-4).
services:
  - type: web
    name: prefab-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    plan: free
    envVars:
      # 프론트 주소가 정해지면 채운다. 비우면 브라우저가 CORS 로 막는다.
      # Vercel 프리뷰(*.vercel.app)는 app.py 의 정규식이 이미 허용한다.
      - key: ALLOWED_ORIGINS
        sync: false
