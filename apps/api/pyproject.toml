[project]
name = "prefab"
version = "0.1.0"
description = "회로도와 펌웨어가 어긋난 곳을 보드 발주 전에 찾아냅니다."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# 데이터시트 추출에만 필요하다. 검사 API 는 이것 없이도 돈다.
datasheet = [
    "anthropic>=0.40",
    "pdfplumber>=0.11",
]

dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    # **`web/repo.py` 가 남의 저장소에 넣을 YAML 을 만든다.** 그게 유효한지
    # 확인하려면 실제 파서로 읽어 봐야 한다. `importorskip` 으로 두면 CI 에서
    # 조용히 건너뛰고, 깨진 파일이 남의 저장소로 나간다 (헌법 2-4).
    "pyyaml>=6.0",
]

[project.scripts]
prefab = "prefab.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prefab", "web"]

# 샘플 검사 JSON (F-4). 패키지 안에 있지만 **명시해 둔다** —
# 배포 이미지에는 tests/ 가 없어서 이 파일이 빠지면 서버에서 다시 만들 길이 없고,
# 조용히 "샘플 없음" 이 된다. 배포하고 나서 알게 되는 종류의 사고다.
[tool.hatch.build]
artifacts = ["src/prefab/samples/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", ".", "tests"]
testpaths = ["tests"]
addopts = "-q"
