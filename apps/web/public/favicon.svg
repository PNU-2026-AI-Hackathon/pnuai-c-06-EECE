<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Prefab 마크 — 끊긴 이음.  ●─ ○

    파비콘은 `currentColor` 를 못 쓴다(상속받을 글자 색이 없다). 그래서 값을 박되
    **다크 모드에서 안 사라지도록** 미디어 쿼리로 한 번 더 정의한다.
    탭 배경이 어두운 브라우저에서 검은 마크는 그냥 안 보인다.

    선을 굵게(3) 잡은 이유는 이 파일이 실제로 16px 로 그려지기 때문이다.
  -->
  <style>
    .mark { fill: #191F28; stroke: #191F28; }
    @media (prefers-color-scheme: dark) {
      .mark { fill: #E8EAEE; stroke: #E8EAEE; }
    }
  </style>
  <circle class="mark" cx="7" cy="16" r="4.4" stroke="none"/>
  <path class="mark" d="M13 16 H17" fill="none" stroke-width="3" stroke-linecap="round"/>
  <circle class="mark" cx="25" cy="16" r="3.6" fill="none" stroke-width="3"/>
</svg>
