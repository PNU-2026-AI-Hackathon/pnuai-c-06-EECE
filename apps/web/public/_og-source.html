<!--
  og.png 의 원본이다. 문구나 마크를 고치면 아래 명령으로 다시 뽑는다 —

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars \
      --screenshot=public/og.png --window-size=1200,630 \
      --virtual-time-budget=5000 file://$PWD/public/_og-source.html

  이 파일은 브라우저로 열어도 되지만 사용자에게 링크하지 않는다.
  `_` 로 시작하는 이유가 그것이다.
-->
<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    width:1200px;height:630px;background:#FFFFFF;
    font-family:"Pretendard Variable",Pretendard,-apple-system,sans-serif;
    color:#191F28;display:grid;grid-template-columns:1fr 420px;
    align-items:center;gap:56px;padding:0 72px;
    word-break:keep-all;
  }
  .brand{display:flex;align-items:center;gap:13px;margin-bottom:30px}
  .brand .word{font-size:28px;font-weight:800;letter-spacing:-.03em}
  h1{font-size:54px;line-height:1.22;font-weight:800;letter-spacing:-.035em}
  h1 em{font-style:normal;color:#1B64DA}
  .sub{margin-top:22px;font-size:22px;line-height:1.55;color:#4E5968}

  /* 오른쪽 — 제품의 얼굴(발견 카드)을 그대로 보여준다 */
  .card{
    border:1px solid #E5E8EB;border-radius:18px;background:#fff;overflow:hidden;
    box-shadow:0 1px 2px rgba(25,31,40,.04),0 14px 34px rgba(25,31,40,.08)
  }
  .card .head{display:flex;align-items:center;gap:9px;padding:15px 18px;border-bottom:1px solid #E5E8EB}
  .sev{background:#FEECEE;color:#D6293E;font-size:12px;font-weight:700;padding:3px 8px;border-radius:7px}
  .rid{font-family:"JetBrains Mono",monospace;font-size:12px;color:#8B95A1}
  .ttl{font-size:14px;font-weight:700}
  .card .body{padding:16px 18px}
  .claim{font-size:14px;line-height:1.6;color:#191F28;margin-bottom:14px}
  .claim b{color:#191F28}
  .lane{display:flex;gap:9px;margin-top:11px}
  .dot{width:9px;height:9px;border-radius:50%;background:#191F28;margin-top:5px;flex:0 0 auto}
  .dot.open{background:transparent;border:1.5px solid #8B95A1}
  .lane-name{font-size:12px;font-weight:700;color:#191F28;margin-bottom:4px}
  .lane-body{
    font-family:"JetBrains Mono",monospace;font-size:11.5px;line-height:1.7;color:#4E5968;
    background:#F2F4F6;border-radius:8px;padding:8px 10px
  }
  .seam{height:1.5px;background:#D6293E;margin:13px 0 2px;opacity:.85}
</style></head><body>
  <div>
    <div class="brand">
      <svg width="32" height="32" viewBox="0 0 32 32">
        <circle cx="7" cy="16" r="4" fill="#191F28"/>
        <path d="M13 16 H17" stroke="#191F28" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="25" cy="16" r="3.4" fill="none" stroke="#191F28" stroke-width="2.6"/>
      </svg>
      <span class="word">Prefab</span>
    </div>
    <h1>보드를 발주하기 전에,<br><em>코드와 회로도가 어긋난 곳</em>을 찾습니다.</h1>
    <p class="sub">컴파일도 되고 업로드도 되는데<br>보드가 안 도는 버그를 잡습니다.</p>
  </div>

  <div class="card">
    <div class="head">
      <span class="sev">치명</span>
      <span class="rid">R04</span>
      <span class="ttl">GPIO 입력 최대 정격 초과</span>
    </div>
    <div class="body">
      <p class="claim">릴레이의 IO 로직 레벨은 <b>5V</b>인데, 같은 네트에 물린 MCU 가 견디는 절대 최대 입력은 <b>3.6V</b>입니다.</p>
      <div class="lane">
        <span class="dot"></span>
        <div style="flex:1;min-width:0">
          <div class="lane-name">회로도가 아는 것</div>
          <div class="lane-body">K1.pad- → _IN_ACTIVE_LOW<br>U1.SDIO → _IN_ACTIVE_LOW</div>
        </div>
      </div>
      <div class="seam"></div>
      <div class="lane">
        <span class="dot"></span>
        <div style="flex:1;min-width:0">
          <div class="lane-name">부품이 아는 것</div>
          <div class="lane-body">Allowed input voltage −0.3 ~ 3.6 V<br>Table 5-1 · p.64</div>
        </div>
      </div>
    </div>
  </div>
</body></html>
