# Render 배포 설정 — API 와 화면을 한 파일에 둔다.
#
# 왜 Render 인가. Railway 는 조직 저장소에 GitHub App 을 설치할 권한이 필요한데
# 우리에게 그 권한이 없다. Render 는 공개 저장소를 App 설치 없이 읽는다.
services:
  # ── 검사 API ────────────────────────────────────────────────────────
  #
  # **영구 디스크를 안 쓴다.** 커밋된 `parts/*.json` 을 기동 때 DB 로 다시 만들기
  # 때문이다 (`service.seed_facts`). 그래서 무료 플랜으로 돈다.
  #
  # 8/23 에 계정이 생기면서 이 선택에 값이 붙었다 — **계정과 검사 결과는 다시
  # 만들 수 없어서 재배포마다 사라진다.** 무료 플랜에는 디스크를 못 붙인다
  # (Render 문서: 유료 서비스에만 붙일 수 있다).
  #
  # 고치려면 `plan` 을 올리고 `disk:` 를 더한 뒤 `PREFAB_DB` 를 그 안으로 옮긴다.
  #
  #     plan: starter
  #     disk:
  #       name: prefab-data
  #       mountPath: /var/prefab
  #       sizeGB: 1
  #     envVars:
  #       - key: PREFAB_DB
  #         value: /var/prefab/prefab.db
  #
  # 그렇게 하면 화면의 "계정이 사라질 수 있습니다" 경고가 **두 번째 기동부터
  # 저절로** 사라진다 — `web/storage.py` 가 표식으로 직접 확인하기 때문이다.
  - type: web
    name: prefab-api
    runtime: docker
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    plan: free
    envVars:
      # 화면 주소. **`onrender.com` 은 app.py 의 vercel.app 정규식에 안 걸린다.**
      # 비우면 브라우저가 CORS 로 막는다 — 대시보드에서 아래 정적 사이트 주소를 넣는다.
      - key: ALLOWED_ORIGINS
        sync: false
      # 세션 쿠키가 생기면서 CORS 가 **보안 경계가 됐다.** 배포에서는 개발
      # 주소(localhost:5173 등)를 닫는다 — 허용된 출처의 페이지는 사용자의
      # 쿠키를 실어 이 API 를 부를 수 있기 때문이다.
      # 개발하는 사람은 이 변수를 안 건드리므로 로컬은 그대로 열려 있다.
      - key: ALLOW_DEV_ORIGINS
        value: "0"

  # ── 화면 ────────────────────────────────────────────────────────────
  - type: web
    name: prefab-web
    runtime: static
    rootDir: apps/web
    # Render 가 pnpm-lock.yaml 을 보고 **의존성 설치를 알아서 먼저 한다.**
    # 여기에 `npm install -g pnpm` 을 넣으면 /usr/lib 가 읽기 전용이라 EROFS 로 죽는다.
    buildCommand: pnpm build
    staticPublishPath: dist
    envVars:
      # **비우면 빌드가 선다** (vite.config.ts). 목 데이터가 배포로 나가는 것보다 낫다.
      - key: VITE_API_BASE
        value: https://pnuai-c-06-eece-prefab.onrender.com
    routes:
      # 화면이 BrowserRouter 를 쓴다. 이 줄이 없으면 리포트 링크(`/r/chk_...`)를
      # 새로고침하거나 남에게 보냈을 때 404 가 난다 — 심사에서 그 링크를 누른다.
      - type: rewrite
        source: /*
        destination: /index.html
