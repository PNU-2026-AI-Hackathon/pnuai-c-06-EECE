# 회로도 드리프트 검사 (F-1)
#
# **이 워크플로가 제품의 최종 형태다.** PR 마다 회로도와 코드를 대조하고,
# 어긋난 것이 이 PR 에서 새로 생겼으면 막는다.
#
# R10(드리프트 규칙)을 기다리지 않는다. 같은 엔진을 두 입력에 돌려서
# 발견 목록을 비교하면 드리프트가 그대로 보인다 (`_docs/결정_기록.md` D-2).
#
# ## 순서가 중요하다
#
#   prefab(HEAD 코드, base 입력)  →  before.json
#   prefab(HEAD 코드, head 입력)  →  after.json
#
# **양쪽 다 HEAD 코드로 돌린다.** base 코드로 base 입력을 돌리면 규칙을 고친 것과
# 보드를 고친 것이 섞여서, 규칙을 추가한 PR 이 "보드가 나빠졌다"로 읽힌다.

name: 드리프트

on:
  pull_request:
    # 입력이 안 바뀐 PR 에서는 돌 이유가 없다. 결과가 항상 "변화 없음"이다.
    paths:
      - "apps/api/tests/fixtures/**"
      - "apps/api/src/prefab/**"
      - ".github/workflows/drift.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  drift:
    name: 회로도 ↔ 코드 대조
    runs-on: ubuntu-latest
    env:
      # 검사할 보드. 실제 프로젝트에서는 자기 보드 파일을 여기에 적는다.
      NETLIST: apps/api/tests/fixtures/esp32-c6-presence-smart-light.d356
      FIRMWARE: apps/api/tests/fixtures/esp32-c6-presence-smart-light.firmware
      BOM: apps/api/tests/fixtures/esp32-c6-presence-smart-light.bom.csv
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        working-directory: apps/api
        run: pip install -e ".[dev]"

      # **배포된 서버와 같은 판단으로 비교한다.**
      #
      # 사실 DB 는 `.gitignore` 라서 CI 에는 없다. 그대로 두면 이 검사가 **제품보다
      # 엄해진다** — 데이터시트로 해제될 항목이 여기서는 "새로 생긴 치명" 으로 떠서
      # PR 을 막는다. 사람은 화면에서 해제된 걸 보고 있는데 CI 만 빨간불이면
      # 그 검사는 곧 꺼진다 (헌법 2-3).
      #
      # 서버가 기동할 때 하는 것과 같은 일이다 (`prefab.datasheet.seed.seed_facts`).
      - name: 부품 사실 심기
        working-directory: apps/api
        run: python -m prefab --facts-load parts/*.json
        env:
          PREFAB_DB: /tmp/prefab-facts.db

      # base 커밋의 입력을 통째로 꺼낸다. 펌웨어가 폴더라서 git show 로는 안 된다.
      - name: base 입력 꺼내기
        id: base
        run: |
          git worktree add --detach /tmp/base "${{ github.event.pull_request.base.sha }}"
          if [ -f "/tmp/base/$NETLIST" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "base 커밋에 $NETLIST 가 없습니다 — 새로 추가된 보드입니다."
          fi

      - name: 검사 (base 입력)
        if: steps.base.outputs.exists == 'true'
        working-directory: apps/api
        run: |
          # `[ -f x ] && ARGS=...` 로 쓰면 안 된다. GitHub 은 `bash -e` 로 돌리는데
          # 조건이 거짓이면 AND 리스트 전체가 0 이 아닌 값을 돌려주고 스텝이 죽는다.
          ARGS="/tmp/base/$NETLIST"
          if [ -d "/tmp/base/$FIRMWARE" ]; then ARGS="$ARGS --firmware /tmp/base/$FIRMWARE"; fi
          if [ -f "/tmp/base/$BOM" ];      then ARGS="$ARGS --bom /tmp/base/$BOM";           fi
          python -m prefab $ARGS --json > /tmp/before.json
        env:
          PREFAB_DB: /tmp/prefab-facts.db

      - name: 검사 (head 입력)
        working-directory: apps/api
        run: |
          ARGS="$GITHUB_WORKSPACE/$NETLIST"
          if [ -d "$GITHUB_WORKSPACE/$FIRMWARE" ]; then ARGS="$ARGS --firmware $GITHUB_WORKSPACE/$FIRMWARE"; fi
          if [ -f "$GITHUB_WORKSPACE/$BOM" ];      then ARGS="$ARGS --bom $GITHUB_WORKSPACE/$BOM";           fi
          python -m prefab $ARGS --json > /tmp/after.json
        env:
          PREFAB_DB: /tmp/prefab-facts.db

      - name: 비교
        id: diff
        if: steps.base.outputs.exists == 'true'
        working-directory: apps/api
        run: |
          set +e
          python -m prefab --diff /tmp/before.json /tmp/after.json \
            --labels "${{ github.event.pull_request.base.ref }}" "이 PR" \
            --fail-on-new > /tmp/comment.md
          echo "code=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat /tmp/comment.md >> "$GITHUB_STEP_SUMMARY"

      # PR 코멘트는 **덧붙이지 않고 갱신한다.** 푸시할 때마다 쌓이면 아무도 안 읽는다.
      # 포크에서 온 PR 은 쓰기 권한이 없어 실패한다 — 그때도 잡 요약에는 이미 남아 있다.
      - name: PR 에 코멘트
        if: steps.base.outputs.exists == 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- prefab-drift -->';
            const body = marker + '\n' + fs.readFileSync('/tmp/comment.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const list = await github.rest.issues.listComments({ owner, repo, issue_number });
            const mine = list.data.find(c => c.body && c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # 판정은 마지막에 한 번만. 코멘트를 못 달았다고 검사 결과가 달라지지 않는다.
      - name: 새 치명 발견이 있으면 실패
        if: steps.base.outputs.exists == 'true' && steps.diff.outputs.code != '0'
        run: |
          echo "이 PR 에서 회로도와 코드가 새로 어긋났습니다. 위 코멘트를 보세요."
          exit 1
