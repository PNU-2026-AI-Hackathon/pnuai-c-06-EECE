# 드리프트 검사의 **짝**이다. 아무것도 안 하고 초록만 보고한다.
#
# ## 왜 이 파일이 있는가
#
# `drift.yml` 은 회로도·규칙·부품 사실이 바뀐 PR 에서만 돈다. 안 바뀐 PR 에서는
# 돌 이유가 없다 — 결과가 항상 "변화 없음"이다.
#
# 그런데 **브랜치 보호가 그 검사를 필수로 요구하면**, 안 도는 PR 은 보고를 영영
# 못 받고 초록인 채로 막힌다. 실제로 그렇게 막혔다 (8/27, PR #95).
#
# GitHub 이 권하는 해법이 이것이다 — **같은 이름의 잡을 반대 조건으로 하나 더 둔다.**
# 둘 중 하나는 반드시 돌고, 보호는 이름만 본다.
#
# ## 왜 그냥 필수에서 빼지 않는가
#
# 「치명 발견이 있으면 머지가 막힌다」가 이 제품이 파는 것이다. 그걸 우리 저장소에서
# 스스로 안 지키면 시연에서 할 말이 없어진다.

name: 드리프트 (건너뜀)

on:
  pull_request:
    # `drift.yml` 의 paths 와 **정확히 반대**여야 한다.
    # 한쪽만 고치면 둘 다 안 도는 PR 이 생기고, 그럼 다시 막힌다.
    paths-ignore:
      - "apps/api/board/**"
      - "apps/api/src/prefab/**"
      - "apps/api/parts/**"
      - ".github/workflows/drift.yml"

jobs:
  drift:
    # **이름이 `drift.yml` 의 잡 이름과 같아야 한다.** 보호는 이름으로 찾는다.
    name: 회로도 ↔ 코드 대조
    runs-on: ubuntu-latest
    steps:
      - run: echo "회로도·규칙·부품 사실이 안 바뀐 PR 입니다. 대조할 것이 없습니다."
