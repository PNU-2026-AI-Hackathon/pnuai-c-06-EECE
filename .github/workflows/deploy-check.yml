# 배포한 URL 이 진짜로 도는가
#
# 헌법 맨 위가 이렇게 적혀 있다:
#
#   **마감**: 2026-08-28 최종 발표. **그 전에 접속 가능한 URL이 있어야 한다.**
#
# 그런데 배포 설정(`railway.json` · `render.yaml`)만 있고 **실제 주소가 저장소 어디에도
# 없다.** 아무도 그 URL 을 모르면 죽어 있어도 발표 당일에야 안다.
#
# 이 워크플로는 두 가지를 가른다.
#
#   주소를 모른다  → 잡 요약에 크게 적고 **성공**으로 끝낸다 (아직 배포를 안 한 것)
#   주소가 죽었다  → **실패**한다 (마감 조건이 깨진 것)
#
# 둘을 같이 실패시키면 "아직 안 함"과 "고장남"이 구별되지 않아서 아무도 안 본다.

name: 배포 점검

on:
  push:
    branches: [main]
  # 하루 한 번. 배포는 아무도 안 건드려도 죽는다 (무료 등급 슬립·크레딧 소진).
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  smoke:
    name: 배포한 URL 스모크
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 주소는 저장소 변수에 둔다 (Settings → Secrets and variables → Actions → Variables).
      # 비밀이 아니라서 secret 이 아니다 — 공개 URL 이고, 로그에 보여야 확인이 된다.
      - name: 주소가 있는가
        id: url
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "set=false" >> "$GITHUB_OUTPUT"
            {
              echo "## ⚠ 배포 URL 이 설정돼 있지 않습니다"
              echo
              echo "헌법: **마감 전에 접속 가능한 URL이 있어야 한다.**"
              echo "지금 이 저장소는 배포 설정만 있고 **주소를 모릅니다.**"
              echo
              echo "정해지면 넣어 주세요 —"
              echo "Settings → Secrets and variables → Actions → Variables → \`API_BASE_URL\`"
              echo
              echo "그때부터 이 워크플로가 매일 두드려서 죽으면 알려줍니다."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
            echo "대상: $API_BASE_URL" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 스모크
        if: steps.url.outputs.set == 'true'
        working-directory: apps/api
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          # smoke.sh 가 헬스체크 · 규칙 카탈로그 · CORS 프리플라이트 · 실제 업로드 ·
          # 계약 불변식 · 샘플 검사(F-4)까지 본다. 발견 목록은 여기서 안 센다 —
          # 그러면 tests/ 와 같은 진실을 두 벌 갖게 된다 (CLAUDE.md 10절).
          chmod +x scripts/smoke.sh
          ./scripts/smoke.sh "$API_BASE_URL" | tee /tmp/smoke.log

      - name: 결과를 요약에 남긴다
        if: always() && steps.url.outputs.set == 'true'
        run: |
          {
            echo "## 배포 점검"
            echo '```'
            cat /tmp/smoke.log 2>/dev/null || echo "스모크가 출력을 남기지 못했습니다."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
