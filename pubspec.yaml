name: pnu_bapmukja
description: 부산대 학생식당·지역상권 통합 웨이팅 플랫폼 "PNU 밥묵자"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.2
  supabase_flutter: ^2.8.0
  http: ^1.2.2

  # ── 추후 연동 ──
  # mobile_scanner: ^5.2.3     # 운영자 QR 체크인 데모 시

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.otf
          weight: 800
